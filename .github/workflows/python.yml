name: Python

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: research/uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest
