name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: research/uv.lock

      - name: Seed demo database
        working-directory: research
        run: |
          uv sync --dev
          uv run python scripts/seed_demo_db.py

      - name: Start API
        working-directory: research
        run: |
          PARALLAX_DB=../data/parallax-demo.db PARALLAX_RATE_LIMIT_MAX=0 \
            uv run uvicorn parallax_research.api.app:app --host 127.0.0.1 --port 8000 --log-level warning &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break || sleep 1; done

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Install Playwright browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: dashboard
        run: npm run test:e2e
