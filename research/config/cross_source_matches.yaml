# Curated Manifold ↔ Polymarket market matches (Task LD.7).
#
# Each pair is the SAME real-world event on both platforms, hand-verified — not a fuzzy topic
# overlap. Only genuine same-event pairs may drive a cross-source divergence signal (constraint
# §2.2); the loader confirms these into `market_matches` and the detector compares their live
# probabilities.
#
# Honest coverage note: genuinely-matching events across the two platforms are rare (Manifold and
# Polymarket phrase and slice most questions differently — e.g. "BTC above $X at close" vs "BTC dips
# to $Y"), so this list is deliberately short. Adding a pair that isn't the identical event would
# manufacture a fake divergence, which is exactly what we refuse to do.
#
# `polymarket_market_id` is the Gamma numeric market id; the loader resolves it to the conditionId
# the poller/detector key on, and fetches the live price. Verified live 2026-09-30.
