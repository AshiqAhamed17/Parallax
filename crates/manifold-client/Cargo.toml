[package]
name = "manifold-client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
futures-util = "0.3.34"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[dev-dependencies]
wiremock = "0.6"
